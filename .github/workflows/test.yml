# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: MicroPython package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_micropg
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Build and install MicroPython
      run: |
        sudo apt update && sudo apt install -y build-essential libffi-dev pkg-config
        git clone --depth 1 --recurse-submodules https://github.com/micropython/micropython.git
        cd micropython
        make -C mpy-cross
        make -C ports/unix submodules
        make -C ports/unix
        sudo make -C ports/unix install
    - name: Test
      run: |
        micropython test_micropg.py
